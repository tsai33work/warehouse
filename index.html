<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>倉庫進出登記</title>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<style>
  :root{
    --main:#1F4E79; --main-dk:#1F4E79; --main-ink:#1F4E79; --main-2:#2E6BA8; --bg:#F3F5F8; --card:#fff; --line:#E1E5EB; --ink:#1D2633; --mute:#6B7685;
    --out:#D9622B; --out-bg:#FDEEE6; --in:#2E8B57; --in-bg:#E5F4EC; --warn:#B42318; --warn-bg:#FDECEA;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  header{position:sticky;top:0;z-index:20;background:var(--main);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
  header h1{margin:0 0 8px;font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  header h1 .sync{font-size:12px;font-weight:400;opacity:.8}
  nav{display:flex;gap:4px}
  nav button{flex:1;background:none;border:0;color:#C9D8EA;padding:10px 0 12px;font-size:15px;border-bottom:3px solid transparent}
  nav button.on{color:#fff;font-weight:700;border-bottom-color:#fff}
  main{max-width:720px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 120px)}
  .card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .step{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:15px;font-weight:700}
  .step .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--main);color:#fff;font-size:12px;font-weight:700;flex:none}
  .step .val{margin-left:auto;font-weight:400;color:var(--mute);font-size:13px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:15px;min-height:44px;line-height:1.2}
  .chip.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
  .chip small{opacity:.65;margin-left:4px;font-size:12px}
  .chip .pf{font-weight:700;margin-right:3px;color:var(--main-2)}
  .chip.on .pf{color:#BFD6EF}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dirbtn{border:2px solid var(--line);background:#fff;border-radius:var(--r);padding:16px 8px;font-size:20px;font-weight:700;min-height:64px}
  .dirbtn span{display:block;font-size:13px;font-weight:400;color:var(--mute)}
  .dirbtn.out.on{background:var(--out-bg);border-color:var(--out);color:var(--out)}
  .dirbtn.in.on{background:var(--in-bg);border-color:var(--in);color:var(--in)}
  .hint{color:var(--mute);font-size:13px;margin:2px 0 0}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button.pm{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:28px;line-height:1}
  .qty input{flex:1;min-width:0;height:56px;text-align:center;font-size:28px;font-weight:700;border:1.5px solid var(--line);border-radius:var(--r);background:#fff}
  .quick{display:flex;gap:8px;margin-top:10px}
  .quick button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:15px}
  .stockline{margin-top:10px;font-size:14px;color:var(--mute)}
  .stockline b{color:var(--ink);font-size:16px}
  .btn{display:block;width:100%;border:0;border-radius:var(--r);padding:15px;font-size:17px;font-weight:700;min-height:54px}
  .btn.primary{background:var(--main);color:#fff}
  .btn.primary:disabled{background:#AEB9C7}
  .btn.ghost{background:#fff;border:1.5px solid var(--main-dk);color:var(--main-ink)}
  .cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .cart-item:first-child{border-top:0}
  .cart-item .t{flex:1;min-width:0}
  .cart-item .t b{display:block}
  .cart-item .t small{color:var(--mute)}
  .cart-item .q{font-size:20px;font-weight:700;white-space:nowrap}
  .cart-item .x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--mute)}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;vertical-align:middle}
  .tag.out{background:var(--out-bg);color:var(--out)}
  .tag.in{background:var(--in-bg);color:var(--in)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .tag.mute{background:var(--bg);color:var(--mute)}
  label.f{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
  input.t{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
  .sites{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .sites .chip{min-height:36px;padding:6px 12px;font-size:14px}
  .submitbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(243,245,248,.96);backdrop-filter:blur(6px);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line)}
  .submitbar .inner{max-width:720px;margin:0 auto}
  .empty{color:var(--mute);text-align:center;padding:18px 0;font-size:14px}
  .hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll .chip{flex:none;min-height:38px;padding:7px 13px;font-size:14px}
  .filters .row{margin-bottom:10px}
  .filters .row:last-child{margin-bottom:0}
  .hist-day{font-size:13px;font-weight:700;color:var(--mute);margin:16px 4px 6px}
  .hist{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fff;border-radius:12px;margin-bottom:6px}
  .hist .tm{font-size:13px;color:var(--mute);width:42px;flex:none;padding-top:2px}
  .hist .body{flex:1;min-width:0}
  .hist .body b{font-weight:600}
  .hist .meta{font-size:13px;color:var(--mute);margin-top:2px}
  .hist .q{font-weight:700;font-size:17px;white-space:nowrap}
  .hist.void{opacity:.55}
  .stock{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:12px;margin-bottom:6px}
  .stock .id{font-size:12px;color:var(--mute);width:40px;flex:none}
  .stock .nm{flex:1;min-width:0}
  .stock .nm small{display:block;color:var(--mute)}
  .stock .num{font-size:20px;font-weight:700;text-align:right;white-space:nowrap}
  .stock .num small{font-size:12px;font-weight:400;color:var(--mute);margin-left:2px}
  .summary{display:flex;gap:8px;margin:4px 0 10px}
  .summary div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center}
  .summary b{display:block;font-size:20px}
  .summary span{font-size:12px;color:var(--mute)}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-20px);opacity:0;transition:.25s;z-index:50;
    background:#1D2633;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:90vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{background:var(--in)}
  .toast.err{background:var(--warn)}
  .overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .dialog{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px}
  .dialog h2{margin:0 0 6px;font-size:18px}
  .dialog p{margin:0 0 14px;color:var(--mute);font-size:14px}
  .pinin{width:100%;height:56px;font-size:26px;letter-spacing:8px;text-align:center;border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px}
  .loading{text-align:center;color:var(--mute);padding:40px 0}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--main-dk);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none !important}
  .me{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.15);border-radius:999px;padding:4px 6px 4px 12px}
  .me button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
  .dialog .chips{margin:4px 0 14px}
  .dialog .err{color:var(--warn);font-size:14px;min-height:20px;margin:-4px 0 8px}
  .dialog .back{display:block;margin:10px auto 0;background:none;border:0;color:var(--mute);font-size:14px}
  .dialog.wide{max-width:520px;max-height:88vh;display:flex;flex-direction:column}
  .clist{overflow-y:auto;margin:0 -4px 12px;padding:0 4px}
  .crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .crow:first-child{border-top:0}
  .crow .t{flex:1;min-width:0}
  .crow .t small{display:block;color:var(--mute)}
  .mini{display:flex;align-items:center;gap:4px;flex:none}
  .mini button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;line-height:1}
  .mini input{width:48px;height:34px;text-align:center;font-size:18px;font-weight:700;border:1.5px solid var(--line);border-radius:10px}
  .csum{font-size:14px;color:var(--mute);margin-bottom:12px}
  .btnrow{display:flex;gap:10px}
  .btnrow .btn{flex:1}
  .capnote{color:var(--out);font-size:13px;margin-top:6px}
  .btn.addout{background:var(--out);color:#fff}
  .btn.addin{background:var(--in);color:#fff}
  .btn.addout:disabled{background:#E8C3B0}
  .cgroup{font-size:13px;font-weight:700;margin:12px 0 2px;padding:4px 10px;border-radius:8px;display:inline-block}
  .cgroup.out{background:var(--out-bg);color:var(--out)}
  .cgroup.in{background:var(--in-bg);color:var(--in)}
  .acc-h{display:flex;align-items:center;font-size:16px;font-weight:700;cursor:pointer;user-select:none}
  .acc-h .caret{margin-left:auto;color:var(--mute);font-size:13px;transition:.2s}
  .acc-h.closed .caret{transform:rotate(-90deg)}
  .srow{display:flex;align-items:center;gap:10px;background:#EAF1F8;border-radius:12px;padding:12px;margin-bottom:8px}
  .srow.off{background:#F1F2F4}
  .srow .who{flex:1;min-width:0}
  .srow .who b{font-size:16px;margin-right:6px;word-break:break-all}
  .srow .who small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
  .sel{height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 8px;font-size:15px;min-width:92px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;vertical-align:middle}
  .pill.ok{background:#DFF3E6;color:#1E7A45}
  .pill.wait{background:#FFF4D6;color:#8A6100}
  .pill.off{background:#FDE6D4;color:#B4541F}
  .lnk{background:#fff;border:1.5px solid #B4541F;color:#B4541F;font-weight:700;font-size:14px;padding:7px 12px;border-radius:10px;white-space:nowrap;flex:none}
  .lnk.on{background:var(--main);border-color:var(--main);color:#fff}
  .lnk.sure{background:var(--warn);border-color:var(--warn);color:#fff}
  .srow{flex-wrap:wrap;row-gap:6px}
  .srow .ll{flex-basis:100%;padding-left:38px;font-size:12px;color:var(--mute)}
  .sbtns{display:flex;flex-direction:column;align-items:stretch;gap:6px;flex:none;width:112px}
  .seg{display:flex;gap:4px}
  .sg{flex:1;background:#fff;border:1.5px solid #C9D1DB;color:#8A94A3;font-weight:700;font-size:14px;padding:7px 0;border-radius:10px}
  .sg.act-on{background:var(--main);border-color:var(--main);color:#fff;opacity:1}
  .sg.act-off{background:#B4541F;border-color:#B4541F;color:#fff;opacity:1}
  .sg.sure{background:var(--warn);border-color:var(--warn);color:#fff}
  .sg:disabled{cursor:default}
  .sg.idle{display:block;text-align:center;background:#EEF0F3;border-color:#D5DAE1;color:#7A8494}
  .sbtns .lnk{text-align:center}
  .pill{white-space:nowrap}
  .srow .sel{min-width:0;width:86px;padding:0 4px}
  .xdel{background:none;border:0;color:#B4541F;font-size:22px;line-height:1;width:28px;height:36px;flex:none;padding:0}
  .xdel.sure{background:var(--warn);color:#fff;border-radius:8px;font-size:12px;width:auto;padding:0 6px;font-weight:700}
  .xdel.ghost{visibility:hidden}
  .addrow{display:flex;align-items:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn.addstaff{width:auto;padding:0 18px;height:48px;min-height:48px;background:var(--main);color:#fff;flex:none}
  .chip.add{border-style:dashed;border-color:#9DB6D3;color:var(--main);background:#F4F8FC;font-weight:600}
  .photos{display:flex;gap:8px;flex-wrap:wrap}
  .ph{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:#E9EDF2}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0}
  .ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed #9DB6D3;background:#F4F8FC;color:var(--main);font-size:13px;font-weight:700;cursor:pointer}
  .ph.add span{font-size:26px;line-height:1.1}
  .ph.add.need{border-color:var(--warn);color:var(--warn);background:#FDF2F1}
  .cphotos{display:flex;gap:6px;margin-top:8px}
  .cphotos img{width:56px;height:56px;object-fit:cover;border-radius:8px}
  .hist .meta a{color:var(--main);font-weight:600;text-decoration:none}
  .refresh{background:none;border:0;color:#fff;font-size:12px;opacity:.85;padding:0}
</style>
</head>
<body>
<header>
  <h1 style="flex-wrap:wrap"><span id="title" style="margin-right:auto">倉庫進出登記</span><span class="me hidden" id="meBox"><span id="meName"></span><button id="logoutBtn">登出</button></span><button class="refresh sync" id="syncBtn" title="重新整理" style="margin-left:10px">↻ <span id="syncTxt">載入中</span></button></h1>
  <nav>
    <button data-tab="reg" class="on">登記</button>
    <button data-tab="hist">進出歷程</button>
    <button data-tab="stock">庫存</button>
    <button data-tab="admin" class="hidden" id="navAdmin">設定</button>
  </nav>
</header>

<main>
  <div id="boot" class="loading"><div class="spinner"></div>資料載入中…</div>

  <!-- 登記 -->
  <section id="tab-reg" class="hidden">
    <div class="card">
      <div class="step"><span class="n">1</span>貨品大項<span class="val" id="v-cat"></span></div>
      <div class="chips" id="cats"></div>
    </div>
    <div class="card hidden" id="card-name">
      <div class="step"><span class="n">2</span>細項<span class="val" id="v-name"></span></div>
      <div class="chips" id="names"></div>
    </div>
    <div class="card hidden" id="card-spec">
      <div class="step"><span class="n">3</span>名稱（規格）<span class="val" id="v-spec"></span></div>
      <div class="chips" id="specs"></div>
    </div>
    <div class="card hidden" id="card-qty">
      <div class="step"><span class="n">4</span>數量<span class="val" id="v-unit"></span></div>
      <div class="qty">
        <button class="pm" id="minus" aria-label="減少">−</button>
        <input id="qty" type="number" inputmode="decimal" min="0" step="any" value="1">
        <button class="pm" id="plus" aria-label="增加">＋</button>
      </div>
      <div class="quick" id="quick">
        <button data-q="1">1</button><button data-q="2">2</button><button data-q="5">5</button><button data-q="10">10</button><button data-q="20">20</button>
      </div>
      <div class="stockline" id="stockline"></div>
      <div class="capnote hidden" id="capnote"></div>
      <div style="height:12px"></div>
      <div class="grid2"><button class="btn addout" id="addOut">出庫</button><button class="btn addin" id="addIn">入庫</button></div>
    </div>

    <div class="card" id="card-cart">
      <div class="step">登記清單<span class="val" id="v-cart">尚未加入品項</span></div>
      <div id="cart"><div class="empty">選好品項與數量後，按「出庫」或「入庫」。<br>出庫、入庫可以混在同一張清單一起送出。</div></div>
      <label class="f" for="site">工地／用途（可不填）</label>
      <input class="t" id="site" placeholder="例：淡水河金色水岸" autocomplete="off">
      <div class="sites" id="sites"></div>
      <label class="f" for="note">備註（可不填）</label>
      <input class="t" id="note" placeholder="損壞、借用對象等" autocomplete="off">
      <label class="f">現場照片 <b style="color:var(--warn)">＊必拍</b>（最多 3 張）</label>
      <div class="photos" id="photos"></div>
      <input type="file" id="photoIn" accept="image/*" capture="environment" class="hidden">
    </div>
  </section>

  <!-- 進出歷程 -->
  <section id="tab-hist" class="hidden">
    <div class="card filters">
      <div class="row hscroll" id="f-range"></div>
      <div class="row hscroll" id="f-dir"></div>
      <div class="row hscroll" id="f-who"></div>
      <div class="row hscroll" id="f-cat"></div>
      <div class="row"><input class="t" id="f-q" placeholder="搜尋品項、規格、工地…" autocomplete="off"></div>
    </div>
    <div class="summary" id="h-sum"></div>
    <div id="h-list"></div>
  </section>

  <!-- 庫存 -->
  <section id="tab-stock" class="hidden">
    <div class="card filters">
      <div class="row hscroll" id="s-cat"></div>
      <div class="row hscroll" id="s-flag"></div>
      <div class="row"><input class="t" id="s-q" placeholder="搜尋品項或編號…" autocomplete="off"></div>
    </div>
    <div id="s-list"></div>
  </section>

  <!-- 設定（管理者） -->
  <section id="tab-admin" class="hidden">
    <div class="card">
      <div class="acc-h" id="accStaff">🔐 系統登入人員管理<span class="caret">▾</span></div>
      <div id="accStaffBody">
        <p class="hint" style="margin:10px 0 12px;line-height:1.6">在這裡新增同仁姓名與角色（會同步寫入試算表「人員」分頁）。同仁第一次登入時會自己設定 PIN；離職時按「停用」可立即收回登入權限，按最左邊「✕」則是從名單移除（過去的進出紀錄仍保留）。只有「管理者」看得到這個設定頁。</p>
        <div id="staffList"><div class="loading"><div class="spinner"></div>讀取中…</div></div>
        <div class="addrow">
          <div><label class="f" style="margin-top:0">角色權限</label><select class="sel" id="newRole"></select></div>
          <div style="flex:1;min-width:0"><label class="f" style="margin-top:0">新增人員姓名</label><input class="t" id="newName" placeholder="輸入同仁姓名，例：陳小明" autocomplete="off"></div>
          <button class="btn addstaff" id="addStaff">＋ 新增人員</button>
        </div>
        <div class="err" id="staffErr" style="color:var(--warn);font-size:14px;margin-top:8px"></div>
      </div>
    </div>
  </section>
</main>

<div class="submitbar hidden" id="submitbar"><div class="inner">
  <button class="btn primary" id="submitBtn" disabled>送出登記</button>
</div></div>

<div class="overlay" id="loginBox"><div class="dialog">
  <div id="lg-code">
    <h2>公司通行碼</h2>
    <p>第一次使用這支手機，請輸入管理員給你的公司通行碼。</p>
    <input class="pinin" id="codeIn" type="tel" inputmode="numeric" maxlength="12" autocomplete="off">
    <div class="err" id="codeErr"></div>
    <button class="btn primary" id="codeOk">下一步</button>
  </div>
  <div id="lg-name" class="hidden">
    <h2>你是誰？</h2>
    <p>點選自己的名字。</p>
    <div class="chips" id="lgNames"></div>
  </div>
  <div id="lg-pin" class="hidden">
    <h2 id="lgPinTitle">輸入 PIN</h2>
    <p id="lgPinHint"></p>
    <input class="pinin" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="PIN">
    <input class="pinin hidden" id="pinIn2" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="再輸入一次">
    <div class="err" id="pinErr"></div>
    <button class="btn primary" id="pinOk">登入</button>
    <button class="back" id="pinBack">← 不是我，重新選名字</button>
  </div>
</div></div>

<div class="overlay" id="confirmBox"><div class="dialog wide">
  <h2>請確認登記內容</h2>
  <div class="csum" id="cSum"></div>
  <div class="clist" id="cList"></div>
  <div class="err" id="cErr"></div>
  <div class="btnrow">
    <button class="btn ghost" id="cBack">返回修改</button>
    <button class="btn primary" id="cOk">確認送出</button>
  </div>
</div></div>

<div class="overlay" id="itemBox"><div class="dialog">
  <h2 id="iTitle">新增品項</h2>
  <p id="iHint"></p>
  <div id="iCatRow"><label class="f">分類</label><input class="t" id="iCat" placeholder="例：測量儀器" autocomplete="off"></div>
  <div id="iNameRow"><label class="f">品項名稱</label><input class="t" id="iName" placeholder="例：雷射水平儀" autocomplete="off"></div>
  <div id="iSpecRow"><label class="f" id="iSpecLbl">規格／尺寸（可不填）</label><input class="t" id="iSpec" placeholder="例：120×80、4吋" autocomplete="off"></div>
  <div style="display:flex;gap:10px">
    <div style="flex:1"><label class="f">單位（可不填）</label><input class="t" id="iUnit" placeholder="支、台、個…" autocomplete="off"></div>
    <div style="flex:1"><label class="f">目前倉庫數量</label><input class="t" id="iInit" type="number" inputmode="decimal" min="0" value="0"></div>
  </div>
  <div class="err" id="iErr" style="margin-top:10px"></div>
  <div class="btnrow"><button class="btn ghost" id="iCancel">取消</button><button class="btn primary" id="iOk">新增</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const CFG = window.WAREHOUSE_CONFIG || {};
  const API = (CFG.API_URL || '').trim();
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LS = {
    get(k, d){ try { const v = localStorage.getItem('wh_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
    set(k, v){ try { localStorage.setItem('wh_' + k, JSON.stringify(v)); } catch(e){} },
  };
  if (CFG.TITLE) { $('#title').textContent = CFG.TITLE; document.title = CFG.TITLE; }

  let DATA = null, HIST = null;
  const S = { cat: '', name: '', item: null, cart: [], photos: [] };
  const H = { range: '7', dir: '全部', who: '全部', cat: '全部', q: '' };
  const ST = { cat: '全部', flag: '全部', q: '' };
  let tab = 'reg';

  // ---------- 登入 ----------
  const AUTH = { code: LS.get('code', ''), name: LS.get('name', ''), pin: LS.get('pin2', '') };
  let LG_STAFF = [], LG_SEL = null;

  async function api(params, body){
    if (!API) throw new Error('尚未設定 API 網址（config.js）');
    const auth = { code: AUTH.code, name: AUTH.name, pin: AUTH.pin };
    let res;
    if (body) {
      res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign(auth, body)) });
    } else {
      const q = new URLSearchParams(Object.assign(auth, params || {}));
      res = await fetch(API + (API.includes('?') ? '&' : '?') + q.toString());
    }
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'CODE') { AUTH.code = ''; LS.set('code', ''); showLogin('code', '公司通行碼不正確'); throw new Error('AUTH'); }
      if (j.error === 'LOGIN') { AUTH.pin = ''; LS.set('pin2', ''); showLogin('name'); throw new Error('AUTH'); }
      throw new Error(j.error || '伺服器錯誤');
    }
    return j;
  }

  function lgStep(s){ lgStep.cur = s; ['code', 'name', 'pin'].forEach(x => $('#lg-' + x).classList.toggle('hidden', x !== s)); }
  async function showLogin(step, err){
    $('#loginBox').classList.add('show');
    if (step === 'code' || !AUTH.code) {
      lgStep('code'); $('#codeErr').textContent = err || ''; setTimeout(() => $('#codeIn').focus(), 50); return;
    }
    lgStep('name');
    const drawNames = () => { $('#lgNames').innerHTML = LG_STAFF.map((s, k) => `<button class="chip" data-k="${k}">${esc(s.name)}${s.hasPin ? '' : '<small>未設定</small>'}</button>`).join('')
        || '<div class="hint">名單是空的，請管理員到試算表「設定」A 欄加入人員。</div>'; };
    const cachedStaff = LS.get('staff', null);
    if (cachedStaff && cachedStaff.length) { LG_STAFF = cachedStaff; drawNames(); }
    else $('#lgNames').innerHTML = '<div class="hint">載入名單中…</div>';
    try {
      const q = new URLSearchParams({ action: 'staff', code: AUTH.code });
      const j = await (await fetch(API + '?' + q.toString())).json();
      if (!j.ok) { if (j.error === 'CODE') { AUTH.code = ''; LS.set('code', ''); return showLogin('code', '公司通行碼不正確'); } throw new Error(j.error); }
      if (lgStep.cur !== 'pin') { LG_STAFF = j.staff; LS.set('staff', j.staff); drawNames(); }
    } catch (e) { $('#lgNames').innerHTML = '<div class="err">⚠ ' + esc(e.message) + '</div>'; }
  }
  $('#codeOk').onclick = async () => {
    const v = $('#codeIn').value.trim(); if (!v) return;
    AUTH.code = v; LS.set('code', v); showLogin('name');
  };
  $('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#codeOk').click(); });
  $('#lgNames').onclick = e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    LG_SEL = LG_STAFF[Number(b.dataset.k)];
    const setting = !LG_SEL.hasPin;
    $('#lgPinTitle').textContent = (setting ? '設定 PIN：' : '輸入 PIN：') + LG_SEL.name;
    $('#lgPinHint').textContent = setting ? '第一次登入，請自己設定 4～8 位數字 PIN，之後都用這組登入。請記住，不要告訴別人。' : '請輸入你自己設定的 PIN。忘記的話請找管理員重設。';
    $('#pinIn2').classList.toggle('hidden', !setting);
    $('#pinOk').textContent = setting ? '設定並登入' : '登入';
    $('#pinIn').value = ''; $('#pinIn2').value = ''; $('#pinErr').textContent = '';
    lgStep('pin'); setTimeout(() => $('#pinIn').focus(), 50);
  };
  $('#pinBack').onclick = () => showLogin('name');
  [$('#pinIn'), $('#pinIn2')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') $('#pinOk').click(); }));
  $('#pinOk').onclick = async () => {
    const pin = $('#pinIn').value.trim(), setting = !LG_SEL.hasPin;
    if (!/^\d{4,8}$/.test(pin)) { $('#pinErr').textContent = 'PIN 請輸入 4～8 位數字'; return; }
    if (setting && pin !== $('#pinIn2').value.trim()) { $('#pinErr').textContent = '兩次輸入的 PIN 不一樣'; return; }
    const btn = $('#pinOk'); btn.disabled = true;
    try {
      const j = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: setting ? 'setpin' : 'login', code: AUTH.code, name: LG_SEL.name, pin }) })).json();
      if (!j.ok) {
        if (j.error === 'CODE') { AUTH.code = ''; LS.set('code', ''); return showLogin('code', '公司通行碼不正確'); }
        $('#pinErr').textContent = j.error === 'LOGIN' ? 'PIN 不正確' : j.error; return;
      }
      AUTH.name = LG_SEL.name; AUTH.pin = pin; LS.set('name', AUTH.name); LS.set('pin2', pin);
      $('#loginBox').classList.remove('show');
      toast('👋 ' + AUTH.name + '，已登入', 'ok');
      load();
    } catch (e) { $('#pinErr').textContent = '連線失敗：' + e.message; }
    finally { btn.disabled = false; }
  };
  $('#logoutBtn').onclick = () => {
    AUTH.name = ''; AUTH.pin = ''; LS.set('name', ''); LS.set('pin2', '');
    DATA = null; HIST = null; SHOWN = false; S.cart = []; S.photos = []; LS.set('data', null); $('#meBox').classList.add('hidden');
    ['reg', 'hist', 'stock', 'admin'].forEach(x => $('#tab-' + x).classList.add('hidden'));
    $('#navAdmin').classList.add('hidden'); tab = 'reg';
    $('#submitbar').classList.add('hidden');
    showLogin('name');
  };

  function toast(msg, type){
    const t = $('#toast');
    t.textContent = msg; t.className = 'toast show ' + (type || '');
    clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', type === 'err' ? 4000 : 2200);
  }

  // 先用手機裡上次的資料立刻顯示，再到背景更新
  let SHOWN = false;
  function applyData(d){
    DATA = d;
    $('#meName').textContent = '👤 ' + DATA.me; $('#meBox').classList.remove('hidden');
    $('#navAdmin').classList.toggle('hidden', !DATA.isAdmin);
    if (!DATA.isAdmin && tab === 'admin') tab = 'reg';
    if (S.item) S.item = DATA.items.find(i => i.id === S.item.id) || null;
    $('#boot').classList.add('hidden');
    if (!SHOWN) { SHOWN = true; showTab(tab); } else if (tab === 'stock') renderStock();
    renderReg();
  }
  const syncedNow = () => { $('#syncTxt').textContent = '已同步 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }); };
  async function load(silent){
    $('#syncTxt').textContent = '同步中';
    if (!DATA) {
      const c = LS.get('data', null);
      if (c && c.me === AUTH.name && c.items) { applyData(c); $('#syncTxt').textContent = '更新中…'; }
    }
    try {
      const d = await api({ action: 'init' });
      applyData(d); LS.set('data', d); syncedNow();
      if (tab === 'hist' || HIST) loadHist(); else setTimeout(() => { if (!HIST && DATA) loadHist(); }, 600);
    } catch (e) {
      $('#syncTxt').textContent = '連線失敗';
      if (DATA && e.message !== 'AUTH') { if (!silent) toast('無法更新，顯示的是上次資料：' + e.message, 'err'); return; }
      if (e.message !== 'AUTH') {
        $('#boot').innerHTML = '⚠ 無法載入資料<br><small>' + esc(e.message) + '</small>';
        if (!silent) toast('無法載入：' + e.message, 'err');
      }
    }
  }
  async function loadHist(){
    if (tab === 'hist' && !HIST) $('#h-list').innerHTML = '<div class="loading"><div class="spinner"></div>讀取紀錄中…</div>';
    try { HIST = (await api({ action: 'history', limit: 1000 })).rows; renderHist(); }
    catch (e) { if (e.message !== 'AUTH') $('#h-list').innerHTML = '<div class="empty">⚠ ' + esc(e.message) + '</div>'; }
  }
  $('#syncBtn').onclick = () => load();

  // ---------- 分頁 ----------
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  function showTab(t){
    tab = t;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    ['reg', 'hist', 'stock', 'admin'].forEach(x => $('#tab-' + x).classList.toggle('hidden', x !== t || !DATA));
    $('#submitbar').classList.toggle('hidden', t !== 'reg' || !DATA);
    if (!DATA) return;
    if (t === 'hist') { HIST ? renderHist() : loadHist(); }
    if (t === 'stock') renderStock();
    if (t === 'admin') loadStaff();
    window.scrollTo(0, 0);
  }

  // ---------- 登記 ----------
  const prefixOf = cat => (DATA.cats.find(c => c.cat === cat) || {}).prefix || '';
  const catsList = () => {
    const known = DATA.cats.map(c => c.cat);
    DATA.items.forEach(i => { if (known.indexOf(i.cat) < 0) known.push(i.cat); });
    return known.filter(c => DATA.items.some(i => i.cat === c));
  };
  const pfSpan = c => { const p = prefixOf(c); return p ? `<span class="pf">${esc(p)}</span>` : ''; };
  const chip = (label, on, attrs, extra) => `<button class="chip${on ? ' on' : ''}" ${attrs || ''}>${extra || ''}${esc(label)}</button>`;
  const fmtNum = n => (n == null || n === '') ? '—' : (Math.round(Number(n) * 100) / 100).toString();
  const specLabel = s => s || '（無規格）';

  function renderReg(){

    const addChip = (mode, label) => DATA.canEditItems ? `<button class="chip add" data-add="${mode}">＋ ${label}</button>` : '';
    $('#cats').innerHTML = catsList().map(c => chip(c, S.cat === c, `data-cat="${esc(c)}"`, pfSpan(c))).join('') + addChip('cat', '新增分類');
    $('#v-cat').textContent = S.cat;

    const inCat = DATA.items.filter(i => i.cat === S.cat);
    const names = [...new Set(inCat.map(i => i.name))];
    $('#card-name').classList.toggle('hidden', !S.cat);
    $('#names').innerHTML = names.map(n => {
      const c = inCat.filter(i => i.name === n).length;
      return chip(n, S.name === n, `data-name="${esc(n)}"`) .replace('</button>', c > 1 ? `<small>${c} 種</small></button>` : '</button>');
    }).join('') + addChip('name', '新增品項');
    $('#v-name').textContent = S.name;

    const specs = inCat.filter(i => i.name === S.name);
    $('#card-spec').classList.toggle('hidden', !S.name);
    $('#specs').innerHTML = specs.map(i => chip(specLabel(i.spec), S.item && S.item.id === i.id, `data-id="${esc(i.id)}"`)).join('') + addChip('spec', '新增規格');
    $('#v-spec').textContent = S.item ? S.item.id : '';

    $('#card-qty').classList.toggle('hidden', !S.item);
    if (S.item) {
      $('#v-unit').textContent = S.item.unit ? '單位：' + S.item.unit : '';
      const st = S.item.stock;
      $('#stockline').innerHTML = '目前帳面庫存：<b>' + fmtNum(st) + '</b> ' + esc(S.item.unit || '') +
        (S.item.alert ? ' <span class="tag warn">' + esc(S.item.alert) + '</span>' : '');
      const mx = capFor(S.item);
      const cn = $('#capnote');
      if (mx == null) { cn.classList.add('hidden'); $('#addOut').disabled = false; }
      else {
        cn.classList.remove('hidden');
        cn.textContent = mx > 0 ? '出庫最多 ' + fmtNum(mx) + ' ' + (S.item.unit || '') + (inCart(S.item.id, '出') ? '（清單裡已出 ' + fmtNum(inCart(S.item.id, '出')) + '）' : '')
                                : '⚠ 庫存不足，無法出庫（仍可入庫）';
        $('#addOut').disabled = mx <= 0;
      }
    }
    renderCart();
  }

  ['#cats', '#names', '#specs'].forEach(s => $(s).addEventListener('click', e => { const a = e.target.closest('[data-add]'); if (a) openItemBox(a.dataset.add); }));
  $('#cats').onclick = e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    S.cat = b.dataset.cat; S.name = ''; S.item = null; renderReg();
    scrollToCard('#card-name');
  };
  $('#names').onclick = e => {
    const b = e.target.closest('[data-name]'); if (!b) return;
    S.name = b.dataset.name; S.item = null;
    const specs = DATA.items.filter(i => i.cat === S.cat && i.name === S.name);
    if (specs.length === 1) { S.item = specs[0]; $('#qty').value = 1; }
    renderReg();
    scrollToCard(specs.length === 1 ? '#card-qty' : '#card-spec');
  };
  $('#specs').onclick = e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    S.item = DATA.items.find(i => i.id === b.dataset.id); $('#qty').value = 1; renderReg();
    scrollToCard('#card-qty');
  };
  function scrollToCard(sel){ setTimeout(() => { const el = $(sel); if (el && !el.classList.contains('hidden')) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); }

  const getQty = () => { const v = parseFloat($('#qty').value); return isFinite(v) ? v : 0; };
  const inCart = (id, dir) => S.cart.filter(c => c.id === id && c.dir === dir).reduce((a, c) => a + c.qty, 0);
  // 出庫上限：期初已盤點的品項才限制；回傳 null 表示不限制
  function capFor(it, excludeCart){
    if (!it || !it.counted || it.stock == null) return null;
    return Math.max(0, it.stock - (excludeCart ? 0 : inCart(it.id, '出')));
  }
  function setQty(v){
    let q = Number(v); if (!isFinite(q) || q < 1) q = 1;
    $('#qty').value = q;
  }
  $('#minus').onclick = () => setQty(getQty() - 1);
  $('#plus').onclick = () => setQty(getQty() + 1);
  $('#quick').onclick = e => { const b = e.target.closest('[data-q]'); if (b) setQty(b.dataset.q); };
  $('#qty').addEventListener('change', () => setQty(getQty()));

  function addLine(dir){
    let q = getQty();
    if (!S.item) return;
    if (!(q > 0)) { toast('數量要大於 0', 'err'); return; }
    if (dir === '出') {
      const mx = capFor(S.item);
      if (mx != null && mx <= 0) { toast('庫存不足，無法出庫', 'err'); return; }
      if (mx != null && q > mx) { q = mx; toast('出庫最多 ' + fmtNum(mx) + '，已自動調整為 ' + fmtNum(mx), ''); }
    }
    const ex = S.cart.find(c => c.id === S.item.id && c.dir === dir);
    if (ex) ex.qty += q; else S.cart.push({ id: S.item.id, qty: q, dir });
    toast('已加入' + (dir === '出' ? '出庫' : '入庫') + '：' + S.item.name + (S.item.spec ? '（' + S.item.spec + '）' : '') + ' × ' + fmtNum(q), 'ok');
    S.name = ''; S.item = null; $('#qty').value = 1;
    renderReg();
    scrollToCard('#card-cart');
  }
  $('#addOut').onclick = () => addLine('出');
  $('#addIn').onclick = () => addLine('進');

  function renderCart(){
    const box = $('#cart');
    if (!S.cart.length) {
      box.innerHTML = '<div class="empty">選好品項與數量後，按「出庫」或「入庫」。<br>出庫、入庫可以混在同一張清單一起送出。</div>';
      $('#v-cart').textContent = '尚未加入品項';
    } else {
      box.innerHTML = S.cart.map((c, k) => {
        const it = DATA.items.find(i => i.id === c.id) || { name: c.id, spec: '', unit: '' };
        const over = c.dir === '出' && it.counted && it.stock != null && c.qty > it.stock;
        return `<div class="cart-item"><div class="t"><b><span class="tag ${c.dir === '出' ? 'out' : 'in'}">${c.dir}</span> ${esc(it.name)}${it.spec ? '（' + esc(it.spec) + '）' : ''}</b>
          <small>${esc(it.id)}・${esc(it.cat || '')}</small>${over ? ' <span class="tag warn">超過帳面庫存 ' + fmtNum(it.stock) + '</span>' : ''}</div>
          <div class="q" style="color:${c.dir === '出' ? 'var(--out)' : 'var(--in)'}">${c.dir === '出' ? '−' : '+'}${fmtNum(c.qty)} <small>${esc(it.unit || '')}</small></div>
          <button class="x" data-del="${k}" aria-label="刪除">×</button></div>`;
      }).join('');
      $('#v-cart').textContent = S.cart.length + ' 項';
    }
    $('#sites').innerHTML = (DATA.sites || []).slice(0, 8).map(s => chip(s, false, `data-site="${esc(s)}"`)).join('');
    const btn = $('#submitBtn');
    renderPhotos();
    const miss = !S.cart.length ? '請加入品項' : !S.photos.length ? '請先拍照' : '';
    btn.disabled = !!miss;
    btn.textContent = miss || `送出登記（${cartLabel()}）→ 確認`;
  }
  $('#cart').onclick = e => { const b = e.target.closest('[data-del]'); if (!b) return; S.cart.splice(Number(b.dataset.del), 1); renderCart(); };
  $('#sites').onclick = e => { const b = e.target.closest('[data-site]'); if (b) $('#site').value = b.dataset.site; };

  // ---------- 照片（必拍） ----------
  function renderPhotos(){
    const need = S.cart.length && !S.photos.length;
    $('#photos').innerHTML = S.photos.map((p, k) => `<div class="ph"><img src="${p}" alt="照片${k + 1}"><button class="rm" data-rmph="${k}" aria-label="刪除照片">✕</button></div>`).join('')
      + (S.photos.length < 3 ? `<div class="ph add${need ? ' need' : ''}" id="phAdd"><span>📷</span>拍照</div>` : '');
  }
  function shrinkPhoto(file){
    return new Promise((ok, bad) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('無法讀取照片')); };
      img.src = url;
    });
  }
  $('#photos').addEventListener('click', e => {
    const rm = e.target.closest('[data-rmph]');
    if (rm) { S.photos.splice(+rm.dataset.rmph, 1); renderCart(); return; }
    if (e.target.closest('#phAdd')) $('#photoIn').click();
  });
  $('#photoIn').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    try { S.photos.push(await shrinkPhoto(f)); renderCart(); toast('📷 已加入照片', 'ok'); }
    catch (err) { toast(err.message, 'err'); }
  });

  const cartLabel = () => { const o = S.cart.filter(c => c.dir === '出').length, i = S.cart.length - o; return [o ? '出 ' + o + ' 項' : '', i ? '進 ' + i + ' 項' : ''].filter(Boolean).join('・'); };
  // ---------- 送出前確認 ----------
  const itemOf = id => DATA.items.find(i => i.id === id) || { id, name: id, spec: '', unit: '', cat: '' };
  function openConfirm(){
    // 進/出 若在加入後才切換成「出」，這裡再統一套用上限
    S.cart.forEach(c => { if (c.dir !== '出') return; const mx = capFor(itemOf(c.id), true); if (mx != null && c.qty > mx) c.qty = mx; });
    S.cart = S.cart.filter(c => c.qty > 0);
    if (!S.cart.length) { toast('清單裡的品項庫存不足，已移除', 'err'); renderCart(); return; }
    if (!S.photos.length) { toast('請先拍照', 'err'); renderCart(); return; }
    $('#cErr').textContent = '';
    renderConfirm();
    $('#confirmBox').classList.add('show');
  }
  function renderConfirm(){
    const site = $('#site').value.trim(), note = $('#note').value.trim();
    $('#cSum').innerHTML = `登記人：<b>${esc(DATA.me)}</b>` +
      (site ? `<br>工地／用途：${esc(site)}` : '') + (note ? `<br>備註：${esc(note)}` : '') +
      `<div class="cphotos">${S.photos.map(p => `<img src="${p}" alt="照片">`).join('')}</div>`;
    const row = (c, k) => {
      const it = itemOf(c.id), mx = c.dir === '出' ? capFor(it, true) : null;
      return `<div class="crow"><div class="t"><b>${esc(it.name)}${it.spec ? '（' + esc(it.spec) + '）' : ''}</b>
        <small>${mx != null ? '最多 ' + fmtNum(mx) + ' ' + esc(it.unit || '') : esc(it.unit || '')}</small></div>
        <div class="mini"><button data-m="${k}" aria-label="減少">−</button>
        <input data-i="${k}" type="number" inputmode="decimal" value="${c.qty}">
        <button data-p="${k}" aria-label="增加">＋</button></div>
        <button class="x" data-del="${k}" aria-label="刪除" style="border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;color:var(--mute)">×</button></div>`;
    };
    let html = '';
    [['出', '出庫（領出）', 'out'], ['進', '入庫（進貨／歸還）', 'in']].forEach(([d, label, cls]) => {
      const rows = S.cart.map((c, k) => [c, k]).filter(([c]) => c.dir === d);
      if (rows.length) html += `<div class="cgroup ${cls}">${label}・${rows.length} 項</div>` + rows.map(([c, k]) => row(c, k)).join('');
    });
    $('#cList').innerHTML = html;
    const ok = $('#cOk');
    ok.textContent = `確認送出（${cartLabel()}）`;
    ok.style.background = 'var(--main)'; ok.style.color = '#fff';
  }
  function setCartQty(k, v){
    const c = S.cart[k]; if (!c) return;
    let q = Number(v); if (!isFinite(q) || q < 1) q = 1;
    const mx = c.dir === '出' ? capFor(itemOf(c.id), true) : null;
    if (mx != null && q > mx) { q = mx; $('#cErr').textContent = itemOf(c.id).name + ' 最多只能出 ' + fmtNum(mx); }
    else $('#cErr').textContent = '';
    c.qty = q;
    const inp = document.querySelector(`#cList input[data-i="${k}"]`); if (inp) inp.value = q;
  }
  $('#cList').onclick = e => {
    const m = e.target.closest('[data-m]'), pl = e.target.closest('[data-p]'), d = e.target.closest('[data-del]');
    if (m) setCartQty(+m.dataset.m, S.cart[+m.dataset.m].qty - 1);
    if (pl) setCartQty(+pl.dataset.p, S.cart[+pl.dataset.p].qty + 1);
    if (d) { S.cart.splice(+d.dataset.del, 1); if (!S.cart.length) { closeConfirm(); return; } renderConfirm(); }
  };
  $('#cList').addEventListener('change', e => { const i = e.target.closest('[data-i]'); if (i) setCartQty(+i.dataset.i, i.value); });
  function closeConfirm(){ $('#confirmBox').classList.remove('show'); renderCart(); }
  $('#cBack').onclick = closeConfirm;

  $('#submitBtn').onclick = () => { if (!$('#submitBtn').disabled) openConfirm(); };
  $('#cOk').onclick = async () => {
    const btn = $('#cOk');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '上傳照片並送出中…';
    try {
      const r = await api(null, { site: $('#site').value.trim(), note: $('#note').value.trim(), lines: S.cart, photos: S.photos });
      $('#confirmBox').classList.remove('show');
      toast('✅ 已登記 ' + r.count + ' 筆', 'ok');
      S.cart = []; S.photos = []; S.cat = ''; S.name = ''; S.item = null;
      $('#note').value = ''; $('#site').value = '';
      HIST = null;
      if (r.init) { applyData(Object.assign({}, DATA, r.init)); LS.set('data', DATA); syncedNow(); setTimeout(loadHist, 300); }
      else await load(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      if (e.message !== 'AUTH') $('#cErr').textContent = '送出失敗：' + e.message;
      else $('#confirmBox').classList.remove('show');
    } finally { btn.disabled = false; if ($('#confirmBox').classList.contains('show')) renderConfirm(); }
  };

  // ---------- 進出歷程 ----------
  const RANGES = [['1', '今天'], ['7', '近 7 天'], ['30', '近 30 天'], ['all', '全部']];
  function rowDate(r){
    if (r.time) return new Date(r.time);
    const m = String(r.date).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  const dayKey = d => d ? d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' }) : '日期待核';
  function renderHist(){
    const whos = ['全部', ...new Set(HIST.map(r => r.who).filter(Boolean))];
    const cats = ['全部', ...catsList()];
    $('#f-range').innerHTML = RANGES.map(([k, v]) => chip(v, H.range === k, `data-k="range" data-v="${k}"`)).join('');
    $('#f-dir').innerHTML = ['全部', '出', '進'].map(v => chip(v === '全部' ? '進＋出' : v, H.dir === v, `data-k="dir" data-v="${v}"`)).join('');
    $('#f-who').innerHTML = whos.map(v => chip(v === '全部' ? '所有人員' : v, H.who === v, `data-k="who" data-v="${esc(v)}"`)).join('');
    $('#f-cat').innerHTML = cats.map(v => chip(v === '全部' ? '所有大項' : v, H.cat === v, `data-k="cat" data-v="${esc(v)}"`, v === '全部' ? '' : pfSpan(v))).join('');

    const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (H.range !== 'all') start.setDate(start.getDate() - (Number(H.range) - 1));
    const q = H.q.toLowerCase();
    const rows = HIST.filter(r => {
      const d = rowDate(r);
      if (H.range !== 'all' && (!d || d < start)) return false;
      if (H.dir !== '全部' && r.dir !== H.dir) return false;
      if (H.who !== '全部' && r.who !== H.who) return false;
      if (H.cat !== '全部' && r.cat !== H.cat) return false;
      if (q && ![r.name, r.spec, r.site, r.note, r.id, r.who].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    const counted = rows.filter(r => String(r.counted).indexOf('否') !== 0);
    $('#h-sum').innerHTML = `<div><b>${rows.length}</b><span>筆紀錄</span></div>
      <div><b style="color:var(--out)">${counted.filter(r => r.dir === '出').length}</b><span>出</span></div>
      <div><b style="color:var(--in)">${counted.filter(r => r.dir === '進').length}</b><span>進</span></div>`;
    if (!rows.length) { $('#h-list').innerHTML = '<div class="empty">沒有符合條件的紀錄</div>'; return; }
    let html = '', last = null;
    rows.forEach(r => {
      const d = rowDate(r), k = dayKey(d);
      if (k !== last) { html += `<div class="hist-day">${esc(k)}</div>`; last = k; }
      const tm = r.time ? d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false }) : '—';
      const voided = String(r.counted).indexOf('否') === 0;
      html += `<div class="hist${voided ? ' void' : ''}"><div class="tm">${tm}</div><div class="body">
        <span class="tag ${r.dir === '出' ? 'out' : 'in'}">${esc(r.dir)}</span> <b>${esc(r.name)}${r.spec ? '（' + esc(r.spec) + '）' : ''}</b>
        <div class="meta">${esc(r.who || '—')}${r.site ? '・' + esc(r.site) : ''}${r.id ? '・' + esc(r.id) : ''}${r.note ? '・' + esc(r.note) : ''}${(r.photo || []).map((u, i) => `・<a href="${esc(u)}" target="_blank" rel="noopener">📷${r.photo.length > 1 ? i + 1 : '照片'}</a>`).join('')}</div>
        ${voided ? '<span class="tag mute">' + esc(r.counted) + '</span> ' : ''}${r.check ? '<span class="tag warn">' + esc(r.check) + '</span>' : ''}
        </div><div class="q">${r.dir === '出' ? '−' : '+'}${fmtNum(r.qty)} <small>${esc(r.unit || '')}</small></div></div>`;
    });
    $('#h-list').innerHTML = html;
  }
  ['#f-range', '#f-dir', '#f-who', '#f-cat'].forEach(s => $(s).onclick = e => {
    const b = e.target.closest('[data-k]'); if (!b) return; H[b.dataset.k] = b.dataset.v; renderHist();
  });
  $('#f-q').oninput = e => { H.q = e.target.value.trim(); renderHist(); };

  // ---------- 庫存 ----------
  function renderStock(){
    const cats = ['全部', ...catsList()];
    $('#s-cat').innerHTML = cats.map(v => chip(v === '全部' ? '所有大項' : v, ST.cat === v, `data-v="${esc(v)}"`, v === '全部' ? '' : pfSpan(v))).join('');
    $('#s-flag').innerHTML = ['全部', '需注意'].map(v => chip(v === '全部' ? '全部品項' : '⚠ 只看需注意', ST.flag === v, `data-f="${v}"`)).join('');
    const q = ST.q.toLowerCase();
    const rows = DATA.items.filter(i =>
      (ST.cat === '全部' || i.cat === ST.cat) &&
      (ST.flag === '全部' || i.alert) &&
      (!q || [i.id, i.name, i.spec].join(' ').toLowerCase().includes(q)));
    $('#s-list').innerHTML = rows.length ? rows.map(i => `<div class="stock"><div class="id">${esc(i.id)}</div>
      <div class="nm">${esc(i.name)}${i.spec ? '（' + esc(i.spec) + '）' : ''}<small>${esc(i.cat)}${i.alert ? ' <span class="tag warn">' + esc(i.alert) + '</span>' : ''}</small></div>
      <div class="num" style="${i.stock < 0 ? 'color:var(--warn)' : ''}">${fmtNum(i.stock)}<small>${esc(i.unit || '')}</small></div></div>`).join('')
      : '<div class="empty">沒有符合的品項</div>';
  }
  $('#s-cat').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; ST.cat = b.dataset.v; renderStock(); };
  $('#s-flag').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; ST.flag = b.dataset.f; renderStock(); };
  $('#s-q').oninput = e => { ST.q = e.target.value.trim(); renderStock(); };

  // ---------- 新增 分類／品項／規格 ----------
  let IMODE = '';
  function openItemBox(mode){
    IMODE = mode;
    const show = (id, on) => $(id).classList.toggle('hidden', !on);
    $('#iTitle').textContent = { cat: '新增分類', name: '新增品項', spec: '新增規格' }[mode];
    $('#iHint').textContent = mode === 'cat' ? '新分類至少要有一個品項。新增後，試算表會自動多一個這個分類的分頁。'
      : mode === 'name' ? '分類：' + S.cat : '分類：' + S.cat + '　品項：' + S.name;
    show('#iCatRow', mode === 'cat'); show('#iNameRow', mode !== 'spec');
    $('#iSpecLbl').textContent = mode === 'spec' ? '規格／尺寸' : '規格／尺寸（可不填）';
    ['#iCat', '#iName', '#iSpec', '#iUnit'].forEach(i => $(i).value = '');
    $('#iInit').value = 0; $('#iErr').textContent = '';
    if (mode === 'spec') { const sib = DATA.items.find(i => i.cat === S.cat && i.name === S.name && i.unit); if (sib) $('#iUnit').value = sib.unit; }
    $('#itemBox').classList.add('show');
    setTimeout(() => $(mode === 'cat' ? '#iCat' : mode === 'name' ? '#iName' : '#iSpec').focus(), 50);
  }
  $('#iCancel').onclick = () => $('#itemBox').classList.remove('show');
  ['#iCat', '#iName', '#iSpec'].forEach(i => $(i).addEventListener('input', () => $('#iErr').textContent = ''));
  $('#iOk').onclick = async () => {
    const cat = IMODE === 'cat' ? $('#iCat').value.trim() : S.cat;
    const name = IMODE === 'spec' ? S.name : $('#iName').value.trim();
    const spec = $('#iSpec').value.trim();
    if (!cat) { $('#iErr').textContent = '請輸入分類'; return; }
    if (!name) { $('#iErr').textContent = '請輸入品項名稱'; return; }
    if (IMODE === 'spec' && !spec) { $('#iErr').textContent = '請輸入規格／尺寸'; return; }
    const btn = $('#iOk'); btn.disabled = true; btn.textContent = '新增中…';
    try {
      const r = await api(null, { action: 'item_add', cat, itemName: name, spec, unit: $('#iUnit').value.trim(), init: $('#iInit').value });
      $('#itemBox').classList.remove('show');
      toast('已新增 ' + name + (spec ? '（' + spec + '）' : '') + '・' + r.id, 'ok');
      if (r.init) { applyData(Object.assign({}, DATA, r.init)); LS.set('data', DATA); syncedNow(); } else await load(true);
      S.cat = cat; S.name = name; S.item = DATA.items.find(i => i.id === r.id) || null; $('#qty').value = 1;
      renderReg(); scrollToCard('#card-qty');
    } catch (e) { if (e.message !== 'AUTH') $('#iErr').textContent = '⚠ ' + e.message; else $('#itemBox').classList.remove('show'); }
    finally { btn.disabled = false; btn.textContent = '新增'; }
  };

  // ---------- 設定：人員管理（管理者） ----------
  let STAFF = [], ROLES = ['管理者', '老闆', '工務部', '工程部'], SURE = null;
  async function staffCall(body){
    $('#staffErr').textContent = '';
    try { const j = await api(null, body); STAFF = j.staff; ROLES = j.roles || ROLES; renderStaff(); return true; }
    catch (e) { if (e.message !== 'AUTH') $('#staffErr').textContent = '⚠ ' + e.message; renderStaff(); return false; }
  }
  function loadStaff(){ return staffCall({ action: 'staff_list' }); }
  function renderStaff(){
    $('#newRole').innerHTML = ROLES.map(r => `<option${r === '工程部' ? ' selected' : ''}>${esc(r)}</option>`).join('');
    if (!STAFF.length) { $('#staffList').innerHTML = '<div class="empty">名單是空的</div>'; return; }
    $('#staffList').innerHTML = STAFF.map((s, k) => {
      const me = s.name === DATA.me;
      const pill = !s.active ? '<span class="pill off">已停用</span>' : s.hasPin ? '<span class="pill ok">已設PIN</span>' : '<span class="pill wait">待設PIN</span>';
      const sure = (a) => SURE === a + k;
      return `<div class="srow${s.active ? '' : ' off'}">
        <button class="xdel${me ? ' ghost' : ''}${sure('x') ? ' sure' : ''}" data-del-staff="${k}" aria-label="移除">${sure('x') ? '確定移除？' : '✕'}</button>
        <select class="sel" data-role="${k}"${s.active ? '' : ' disabled'}>${ROLES.map(r => `<option${r === s.role ? ' selected' : ''}>${esc(r)}</option>`).join('')}</select>
        <div class="who"><b>${esc(s.name)}</b>${pill}${me ? ' <span class="pill ok" style="background:#E3ECF7;color:var(--main)">我</span>' : ''}
</div>
        <div class="sbtns">${
          !s.active ? `<button class="sg act-on" data-on="${k}">啟用</button>`
          : !s.hasPin ? `<span class="sg idle">未啟用</span>`
          : `<button class="lnk${sure('r') ? ' sure' : ''}" data-reset="${k}">${sure('r') ? '確定重設？' : '重設PIN'}</button>
             <button class="lnk${sure('d') ? ' sure' : ''}" ${me ? 'disabled style="opacity:.4"' : `data-off="${k}"`}>${sure('d') ? '確定停用？' : '停用'}</button>`
        }</div>
        ${s.lastLogin ? `<div class="ll">最後登入：${esc(s.lastLogin)}</div>` : ''}
      </div>`;
    }).join('');
  }
  $('#accStaff').onclick = () => { $('#accStaff').classList.toggle('closed'); $('#accStaffBody').classList.toggle('hidden'); };
  $('#staffList').addEventListener('change', e => {
    const s = e.target.closest('[data-role]'); if (!s) return;
    staffCall({ action: 'staff_role', target: STAFF[+s.dataset.role].name, role: s.value }).then(ok => ok && toast('已更新角色', 'ok'));
  });
  $('#staffList').addEventListener('click', e => {
    const r = e.target.closest('[data-reset]'), d = e.target.closest('[data-off]'), o = e.target.closest('[data-on]'), x = e.target.closest('[data-del-staff]');
    if (x) { const k = x.dataset.delStaff; if (STAFF[+k].name === DATA.me) return;
      if (SURE !== 'x' + k) { SURE = 'x' + k; renderStaff(); setTimeout(() => { if (SURE === 'x' + k) { SURE = null; renderStaff(); } }, 4000); return; }
      SURE = null; const nm = STAFF[+k].name; staffCall({ action: 'staff_delete', target: nm }).then(ok => ok && toast('已移除 ' + nm, 'ok')); }
    if (r) { const k = r.dataset.reset; if (SURE !== 'r' + k) { SURE = 'r' + k; renderStaff(); setTimeout(() => { if (SURE === 'r' + k) { SURE = null; renderStaff(); } }, 4000); return; }
      SURE = null; staffCall({ action: 'staff_resetpin', target: STAFF[+k].name }).then(ok => ok && toast('已重設，請他下次登入重新設定 PIN', 'ok')); }
    if (d) { const k = d.dataset.off; if (SURE !== 'd' + k) { SURE = 'd' + k; renderStaff(); setTimeout(() => { if (SURE === 'd' + k) { SURE = null; renderStaff(); } }, 4000); return; }
      SURE = null; staffCall({ action: 'staff_toggle', target: STAFF[+k].name, active: false }).then(ok => ok && toast('已停用', 'ok')); }
    if (o) staffCall({ action: 'staff_toggle', target: STAFF[+o.dataset.on].name, active: true }).then(ok => ok && toast('已重新啟用', 'ok'));
  });
  $('#addStaff').onclick = async () => {
    const name = $('#newName').value.trim();
    if (!name) { $('#staffErr').textContent = '請輸入姓名'; return; }
    const btn = $('#addStaff'); btn.disabled = true;
    const ok = await staffCall({ action: 'staff_add', newName: name, role: $('#newRole').value });
    btn.disabled = false;
    if (ok) { $('#newName').value = ''; toast('已新增 ' + name, 'ok'); }
  };
  $('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#addStaff').click(); });

  // ---------- 啟動 ----------
  if (!API) {
    $('#boot').innerHTML = '⚠ 尚未設定資料來源<br><small>請在 GitHub 編輯 config.js，貼上 Apps Script 網頁應用程式網址。</small>';
    $('#syncTxt').textContent = '未設定';
  } else if (!AUTH.code || !AUTH.name || !AUTH.pin) {
    $('#boot').classList.add('hidden');
    showLogin(AUTH.code ? 'name' : 'code');
  } else {
    load();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && DATA) load(true); });
})();
</script>
</body>
</html>
